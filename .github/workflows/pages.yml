name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Snapshot pages (changelog, error reference) are read from the minigraf repository at
  # each version's ref, including the unreleased v3 branch, so rebuild daily.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out minigraf (all tags and branches)
        uses: actions/checkout@v4
        with:
          repository: project-minigraf/minigraf
          path: minigraf-src
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Lint and test the builder
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build the site
        run: cargo run --release -- build --source-repo minigraf-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: End-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
